<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Management Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      min-height: 100vh;
    }
    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: #1e293b;
      color: #fff;
      padding: 20px;
    }
    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 30px;
      color: #38bdf8;
    }
    .sidebar ul {
      list-style: none;
    }
    .sidebar ul li {
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sidebar ul li:hover, .sidebar ul li.active {
      background-color: #334155;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 30px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    
    /* Stats Cards */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .card h3 {
      font-size: 14px;
      color: #64748b;
    }
    .card p {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
      color: #0f172a;
    }

    /* Section Forms & Tables */
    .content-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .form-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    input, select, button {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background-color: #1d4ed8;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f8fafc;
      color: #475569;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-active { background: #dcfce7; color: #15803d; }
    .badge-leave { background: #fef9c3; color: #a16207; }
  </style>
</head>
<body>

  <!-- Sidebar Nav -->
  <div class="sidebar">
    <h2>CorpManager</h2>
    <ul>
      <li class="active">Dashboard</li>
      <li>Employees</li>
      <li>Departments</li>
      <li>Settings</li>
    </ul>
  </div>

  <!-- Main Area -->
  <div class="main-content">
    <header>
      <h1>Company Management</h1>
      <button onclick="toggleForm()">+ Add Employee</button>
    </header>

    <!-- Stat Cards -->
    <div class="stats-container">
      <div class="card">
        <h3>Total Employees</h3>
        <p id="totalCount">0</p>
      </div>
      <div class="card">
        <h3>Active Employees</h3>
        <p id="activeCount">0</p>
      </div>
      <div class="card">
        <h3>On Leave</h3>
        <p id="leaveCount">0</p>
      </div>
    </div>

    <!-- Form Section (Hidden by default) -->
    <div class="content-box" id="formContainer" style="display:none; margin-bottom: 20px;">
      <h3>Add New Employee</h3>
      <br>
      <form id="empForm">
        <div class="form-group">
          <input type="text" id="name" placeholder="Full Name" required>
          <input type="text" id="role" placeholder="Role / Position" required>
          <input type="text" id="dept" placeholder="Department" required>
          <select id="status">
            <option value="Active">Active</option>
            <option value="On Leave">On Leave</option>
          </select>
        </div>
        <button type="submit">Save Employee</button>
      </form>
    </div>

    <!-- Employee Table -->
    <div class="content-box">
      <h3>Employee Directory</h3>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Department</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="empTableBody">
          <!-- Dynamic Data -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Initial State
    let employees = [
      { id: 1, name: 'Rahul Sharma', role: 'Developer', dept: 'IT', status: 'Active' },
      { id: 2, name: 'Priya Patel', role: 'HR Manager', dept: 'HR', status: 'Active' },
      { id: 3, name: 'Amit Verma', role: 'Designer', dept: 'UI/UX', status: 'On Leave' }
    ];

    function renderData() {
      const tbody = document.getElementById('empTableBody');
      tbody.innerHTML = '';

      let active = 0;
      let leave = 0;

      employees.forEach((emp, index) => {
        if(emp.status === 'Active') active++;
        if(emp.status === 'On Leave') leave++;

        const row = `
          <tr>
            <td>${emp.name}</td>
            <td>${emp.role}</td>
            <td>${emp.dept}</td>
            <td>
              <span class="badge ${emp.status === 'Active' ? 'badge-active' : 'badge-leave'}">
                ${emp.status}
              </span>
            </td>
            <td>
              <button style="background: #ef4444; padding: 5px 10px;" onclick="deleteEmp(${index})">Delete</button>
            </td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      document.getElementById('totalCount').innerText = employees.length;
      document.getElementById('activeCount').innerText = active;
      document.getElementById('leaveCount').innerText = leave;
    }

    function toggleForm() {
      const formBox = document.getElementById('formContainer');
      formBox.style.display = formBox.style.display === 'none' ? 'block' : 'none';
    }

    document.getElementById('empForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const newEmp = {
        id: Date.now(),
        name: document.getElementById('name').value,
        role: document.getElementById('role').value,
        dept: document.getElementById('dept').value,
        status: document.getElementById('status').value
      };
      employees.push(newEmp);
      renderData();
      this.reset();
      toggleForm();
    });

    function deleteEmp(index) {
      employees.splice(index, 1);
      renderData();
    }

    // Initial Load
    renderData();
  </script>
</body>
</html>
